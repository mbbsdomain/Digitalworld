  var SALT_HEX = "2d4cfc4f37e88f431f07b183cfdd0ca4";
  var IV_HEX = "93c20aa5e4790179a7922cc50ecae1ba";
  var pwdInput = document.getElementById("pwdInput");
  var decryptBtn = document.getElementById("decryptBtn");
  var lockError = document.getElementById("lockError");
  var lockProgress = document.getElementById("lockProgress");
  var lockCard = document.getElementById("lockCard");
  var decryptedContent = document.getElementById("decryptedContent");
  var decryptedFrame = document.getElementById("decryptedFrame");
  pwdInput.addEventListener("keypress", function(e) {
    if (e.key === "Enter") { e.preventDefault(); attemptDecrypt(); }
  });
  decryptBtn.addEventListener("click", attemptDecrypt);
  function attemptDecrypt() {
    var password = pwdInput.value;
    if (!password) return;
    lockError.style.display = "none";
    decryptBtn.disabled = true;
    decryptBtn.textContent = "Decrypting...";
    lockProgress.style.display = "block";
    setTimeout(function() {
      try {
        var salt = CryptoJS.enc.Hex.parse(SALT_HEX);
        var key = CryptoJS.PBKDF2(password, salt, { keySize: 256 / 32, iterations: 600000, hasher: CryptoJS.algo.SHA256 });
        var iv = CryptoJS.enc.Hex.parse(IV_HEX);
        var decrypted = CryptoJS.AES.decrypt(CIPHERTEXT, key, { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
        var htmlContent = decrypted.toString(CryptoJS.enc.Utf8);
        if (!htmlContent) { throw new Error("Decryption failed"); }
        lockCard.style.display = "none";
        decryptedContent.style.display = "block";
        decryptedFrame.srcdoc = htmlContent;
      } catch (err) {
        lockError.style.display = "block";
        decryptBtn.disabled = false;
        decryptBtn.textContent = "Unlock";
        lockProgress.style.display = "none";
        pwdInput.select();
      }
    }, 200);
  }
